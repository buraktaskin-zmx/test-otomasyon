# Orchestrator. This is the only port analysts reach; executors stay internal
# to the Docker network.
server.port=8035

# Executors to dispatch to, comma separated host:port. Overridden in the
# container with:
#   EXECUTORS=executor-1:9035,executor-2:9035,executor-3:9035
executors=localhost:9035

# Per-call bound on every executor request. A restarting or hung executor must
# lose its turn quickly rather than stall the orchestrator.
executorTimeoutMs=5000



# ===========================================================================
# LLM — OpenAI-compatible chat endpoint (Spring AI). Drafts Gherkin for analysts.
#
# base-url MUST end in /v1. Spring AI 2.x wraps the official OpenAI Java SDK
# (com.openai:openai-java, visible in any stack trace), and that SDK follows the
# same convention as every official OpenAI client: the base URL already carries
# the version segment and only "/chat/completions" is appended to it. Spring AI
# 1.x used its own client and appended "/v1/chat/completions" itself, so the
# older advice was the exact opposite — dropping /v1 here sends the request to
# /chat/completions, which vLLM's FastAPI layer answers with a bare
# {"detail":"Not Found"} 404 that mentions neither the path nor the model.
#
# model id is what THIS server serves it as, confirmed with GET /v1/models:
#   {"id":"qwen3-6", "root":"/filebrowser/Qwen3.6-35B-A3B-AWQ-4bit",
#    "max_model_len":131072}
# "qwen3" is rejected with vLLM's own rich error naming the model. Two different
# 404s, two different causes: a bare {"detail":"Not Found"} is a PATH problem,
# a {"error":{"message":"The model ... does not exist"}} is a MODEL problem.
# ===========================================================================

# --- ENDPOINT A: vLLM, direct. Authenticates nobody. ACTIVE. ---------------
# api-key is a placeholder, not a secret: this endpoint needs none, but the
# starter's auto-configuration refuses to start the context without a value.
spring.ai.openai.base-url=https://vllm-uyz-dsp-genai.apps.lan-dev-dc1-ocp.yapikredi.com.tr/v1
spring.ai.openai.api-key=not-needed-for-direct-vllm
spring.ai.openai.chat.options.model=qwen3-6

# --- ENDPOINT B: bifrost proxy. Real Bearer key. Comment A out, uncomment. --
#spring.ai.openai.base-url=https://bifrost-proxy-server-dsp-ddi.apps.lan-dev-dc1-ocp.yapikredi.com.tr/v1
#spring.ai.openai.api-key=sk-bf-a4a6d317-618a-40cf-88d7-5cae6eeb3df9
#spring.ai.openai.chat.options.model=cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit

# 0.0 = deterministic, 1.0 = creative. Gherkin generation wants the low end:
# the same request must produce the same scenario, not a new invention.
spring.ai.openai.chat.options.temperature=0.3

# The model reports max_model_len 131072, so the whole prompt — vocabulary.json
# plus a screen catalog plus example scenarios — fits with room to spare.

# Screen catalogs the LLM prompt is built from, relative to the working
# directory (the repo root when run from the IDE).
catalogs.dir=./catalogs

# Repair turns after a rejected draft. One fixes nearly everything a second
# would; beyond that the model mostly re-words the same mistake at the cost of
# another full generation.
llm.max-repairs=1
