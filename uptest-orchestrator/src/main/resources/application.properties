# Orchestrator. This is the only port analysts reach; executors stay internal
# to the Docker network.
server.port=8035

# Executors to dispatch to, comma separated host:port. Overridden in the
# container with:
#   EXECUTORS=executor-1:9035,executor-2:9035,executor-3:9035
executors=localhost:9035

# Per-call bound on every executor request. A restarting or hung executor must
# lose its turn quickly rather than stall the orchestrator.
executorTimeoutMs=5000



# ===========================================================================
# LLM — OpenAI-compatible chat endpoint (Spring AI). Drafts Gherkin for analysts.
#
# base-url MUST end in /v1. Spring AI 2.x wraps the official OpenAI Java SDK
# (com.openai:openai-java, visible in any stack trace), and that SDK follows the
# same convention as every official OpenAI client: the base URL already carries
# the version segment and only "/chat/completions" is appended to it. Spring AI
# 1.x used its own client and appended "/v1/chat/completions" itself, so the
# older advice was the exact opposite — dropping /v1 here sends the request to
# /chat/completions, which vLLM's FastAPI layer answers with a bare
# {"detail":"Not Found"} 404 that mentions neither the path nor the model.
#
# model id is what THIS server serves it as, confirmed with GET /v1/models:
#   {"id":"qwen3-6", "root":"/filebrowser/Qwen3.6-35B-A3B-AWQ-4bit",
#    "max_model_len":131072}
# "qwen3" is rejected with vLLM's own rich error naming the model. Two different
# 404s, two different causes: a bare {"detail":"Not Found"} is a PATH problem,
# a {"error":{"message":"The model ... does not exist"}} is a MODEL problem.
# ===========================================================================

# --- WHICH ENDPOINT CAN DRIVE TOOLS -----------------------------------------
# Drafting Gherkin is one model call and needs nothing special. The MCP agent
# needs the SERVER to parse the model's tool calls into the API's tool_calls
# field, and that is a per-deployment setting, not a model capability. The same
# qwen model served two ways behaves differently, which makes the endpoint the
# variable rather than the model:
#
#   A + qwen3-6            Parsed. The agent walked the DBS flow and closed it
#                          with submit_catalog.
#   B + gpt-oss-120b       Parsed by the WRONG parser. gpt-oss speaks harmony
#                          and its control tokens leak into the call: a
#                          function named "browser_find<|channel|>commentary",
#                          browser_snapshot with target=null, a snapshot ref
#                          pushed into a selector argument ("Unknown engine
#                          'ref' while parsing selector ref=f1e41").
#   B + the SAME qwen      NOT PARSED AT ALL. The call arrives as plain text in
#                          the answer -- browser_navigate<parameter=url>...
#                          </parameter></function></tool_call> -- so no tool
#                          ever runs and /explore/catalog reports "Model
#                          hicbir katalog aracini cagirmadi".
#
# Neither B failure is fixable from here: trimming a mangled name only moves
# the break to the arguments, and text in a content field was never a tool call
# to begin with. For B to run the agent, the platform team must serve it with a
# tool-call parser matching each model (harmony for gpt-oss, hermes for qwen).
# Until then: A for the agent.

# --- ENDPOINT A: vLLM, direct. ACTIVE. Authenticates nobody. ----------------
# api-key is a placeholder, not a secret: this endpoint needs none, but the
# starter's auto-configuration refuses to start the context without a value.
# Serves ONE model, confirmed with GET /v1/models: qwen3-6.
spring.ai.openai.base-url=https://vllm-uyz-dsp-genai.apps.lan-dev-dc1-ocp.yapikredi.com.tr/v1
spring.ai.openai.api-key=not-needed-for-direct-vllm
spring.ai.openai.chat.options.model=qwen3-6

# --- ENDPOINT B: bifrost proxy. Prose only -- see the note above. -----------
# Fronts several internal vLLM deployments, so nothing leaves the bank here
# either. GET /v1/models lists them PREFIXED BY PROVIDER, and that full id is
# the model name — "openai/gpt-oss-120b" on its own is rejected with vLLM's
# own "The model ... does not exist":
#   vllm-gpt-oss/openai/gpt-oss-120b
#   vllm-gpt-oss-2/openai/gpt-oss-120b        (a second instance of the same)
#   vllm-qwen36/cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
#
# The proxy asks for its virtual key in an x-bf-vk header, but also accepts it
# as Authorization: Bearer — which is what Spring AI sends, so the standard
# api-key property is enough and no custom header wiring is needed.
#spring.ai.openai.base-url=https://bifrost-proxy-server-dsp-ddi.apps.lan-dev-dc1-ocp.yapikredi.com.tr/v1
#spring.ai.openai.api-key=sk-bf-a4a6d317-618a-40cf-88d7-5cae6eeb3df9
#spring.ai.openai.chat.options.model=vllm-gpt-oss/openai/gpt-oss-120b
#spring.ai.openai.chat.options.model=vllm-qwen36/cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit

# 0.0 = deterministic, 1.0 = creative. Gherkin generation wants the low end:
# the same request must produce the same scenario, not a new invention.
spring.ai.openai.chat.options.temperature=0.3

# The model reports max_model_len 131072, so the whole prompt — vocabulary.json
# plus a screen catalog plus example scenarios — fits with room to spare.

# Screen catalogs the LLM prompt is built from, relative to the working
# directory (the repo root when run from the IDE).
catalogs.dir=./catalogs

# Repair turns after a rejected draft. One fixes nearly everything a second
# would; beyond that the model mostly re-words the same mistake at the cost of
# another full generation.
llm.max-repairs=1

# Hard cap on one "Çoklu Üret" batch. The batch is SEQUENTIAL and each scenario
# is its own generate-validate-repair round, so the wall clock is roughly
# count x (1 + max-repairs) model calls — ten is already a couple of minutes on
# a request the analyst is watching, and the endpoint is synchronous.
#
# It is also a ceiling on something that cannot pay off: diversity is bounded by
# what the screen offers, and VariationPlanner reports when the count exceeds the
# PRODUCT of its choice fields' sizes — the real number of distinct combinations.
# Every catalog in this repo today is nearly unvarying (three single-option
# dropdowns on the DBS form, one two-option one), so its product is 2 and past
# the second scenario only the data differs. A typed 500 gets 10 and a note
# saying so, rather than an hour of the model producing near-duplicates.
llm.max-scenarios=10

# How many scenarios of one batch are generated AT THE SAME TIME.
#
# The batch was sequential, on the reasoning that one vLLM deployment means five
# requests share one GPU and finish no sooner. That reasoning was wrong about
# this particular server: continuous batching is what vLLM exists for, so
# concurrent requests are folded into the same forward pass. The model makes it
# starker — Qwen3.6-35B-A3B is a mixture of experts with 3B active parameters,
# so a single request is memory-bandwidth bound and leaves the GPU idle.
# Measured expectation: five scenarios go from 1-2.5 minutes to well under one.
#
# Bounded rather than unbounded because this endpoint is SHARED with other teams:
# firing ten at once pushes everyone else's request behind them. Raise it only
# after watching what it does to the other users of that deployment.
llm.batch-concurrency=4


# ===========================================================================
# MCP exploration agent — a model driving a REAL browser against the REAL test
# bank. Off unless this says true: ExploreController is @ConditionalOnProperty
# on it, so without the line the endpoints do not exist and every call to them
# answers 404 Not Found — which looks like a model or path problem and is not.
# ===========================================================================
uptest.explore.enabled=true

# The MCP server itself, declared once in .mcp.json at the repo root so the
# IDE's own MCP client and this service read the same file. The path resolves
# against the working directory, which is the repo root when run from the IDE.
#
# Two things that file depends on, neither of them visible from here:
#
# 1. The Playwright MCP tool is installed OUTSIDE the repo, and .mcp.json names
#    it by ABSOLUTE path (C:/tools/playwright-mcp/...). That path is therefore
#    a contract, not a local preference: the same location on every machine
#    that runs this service, which is why .mcp.json is committed rather than
#    ignored. Install it elsewhere and the only symptom is the MCP server
#    failing to start.
# 2. "the working directory ... is the repo root" is an assumption, and it
#    holds for an IDE run and NOT for `java -jar` started from anywhere else.
#    A `file:` resource that is not found is not a warning you have to go
#    looking for, so if the agent is dead on a jar run, check the CWD first.
spring.ai.mcp.client.stdio.servers-configuration=file:.mcp.json

# Spring AI's default is 20s, which is short for a browser: one form on this
# application takes four seconds just to settle, and a login flow much longer.
spring.ai.mcp.client.request-timeout=120s


# ===========================================================================
# PERSISTENCE — H2, file mode, owned by the orchestrator alone.
#
# What this closes: RunService.runs and CatalogDiscoveryService.runs were
# ConcurrentHashMaps. A restart lost every run the UI lists while the report,
# log and traces those rows pointed at stayed on the executor's disk — the
# files outlived the record that found them, which is the one thing analysts
# could not forgive.
#
# The executor gets NO datasource. It must stay disposable: restarting it is the
# documented remedy for a hung Playwright call (which cannot be killed from
# Java), and a process that may be killed at any moment cannot be the one
# holding state. See uptest-executor/src/main/java/server/CLAUDE.md.
# ===========================================================================

# Under LOCALAPPDATA, OUTSIDE the checkout. Both halves matter.
#
# OUTSIDE: the VDI runs this project from a UNC network share mapped to Z:, so
# a path relative to the working directory would put the database file on SMB.
# H2 does not recommend keeping a database file on a network share: lock
# semantics are unreliable there, every commit pays network latency, and a
# connection dropped mid-write can corrupt the .mv.db. Making run history
# durable and then storing it somewhere it can be corrupted is the opposite of
# the point. It also means the database does NOT travel when the checkout is
# copied to the VDI, which is correct: it is that machine's run history, not
# source.
#
# LOCALAPPDATA: Windows excludes AppData\Local from roaming profiles by design,
# so it is real local disk on the VDI. Verified working there 2026-10-06.
#
# The backslashes LOCALAPPDATA contains are NOT a properties-file escaping
# problem: they arrive from the environment at runtime, not from this file's
# text. H2 and the JVM both accept mixed separators on Windows.
#
# The fallback keeps a non-Windows or service context (where LOCALAPPDATA is
# unset) from failing the context with "Could not resolve placeholder" — it
# lands back in the checkout, which is fine for anything that is not the VDI.
# The "./" in it is MANDATORY: H2 2.x rejects an implicit relative path
# outright ("Implicit relative path is not allowed"), and that error names
# neither the property nor the fix.
#
# If startup fails with a directory error, create the folder once by hand; H2
# is not guaranteed to build the parent path for you. It is a loud failure.
#
# SPRING_DATASOURCE_URL overrides this with no change here. There is no
# container override: Docker is not used for this project and does not work on
# the VDI.
#
# DB_CLOSE_ON_EXIT=FALSE disables H2's own JVM shutdown hook so that closing
# the DataSource is what closes the database. Left on, H2's hook races Hikari's
# and shutdown logs a flurry of "The database has been closed" that looks like
# data loss and is not.
#
# Deliberately ABSENT, each for a reason:
#   MODE=PostgreSQL   Changes H2's own identifier case folding — a schema-level
#                     behaviour change under ddl-auto=update for no benefit:
#                     Hibernate still selects H2Dialect and still emits H2 DDL.
#                     Portability comes from the column types (see the
#                     entities), not from a compatibility mode.
#   AUTO_SERVER=TRUE  Exists to let a SECOND process open the same file, which
#                     is precisely what must never happen (two orchestrators,
#                     two writers, one corrupt file).
#   DB_CLOSE_DELAY    In-memory only. Meaningless for a file.
spring.datasource.url=jdbc:h2:file:${LOCALAPPDATA:./data}/uptest/uptest;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# EXPLICIT, and NOT redundant — do not "clean this up".
#
# Boot derives the ddl-auto default from EmbeddedDatabaseConnection
# .isEmbeddedUrl, which for H2 tests url.contains(":h2:mem"). A FILE url is
# therefore classified "not embedded" and the default becomes "none", meaning
# no tables are ever created and the first /api/v1/runs dies with
# `Table "TEST_RUN" not found`. (Boot <= 2.6 had the opposite bug and would
# have wiped the file with create-drop; spring-boot#32865 fixed it. Writing
# the value down closes both directions.)
#
# "update" is the whole schema strategy: no Flyway, no Liquibase, no SQL
# files. Know its limits before relying on it — update ADDS tables, columns
# and indexes. It never drops, never renames, never widens, never retypes.
# The entity classes ARE the schema; a git diff on one is the only migration
# review that will ever happen.
spring.jpa.hibernate.ddl-auto=update

# Boot defaults this to true and WARNs about it at every startup, which is why
# the warning gets ignored. False because there are deliberately NO lazy
# associations on these entities (TEST_RUN_STEP carries a plain run_id column,
# not a @ManyToOne), so with this off a future accidental association fails
# loudly with LazyInitializationException instead of quietly firing N queries
# during JSON serialization. A silent pass is worse than a failure.
spring.jpa.open-in-view=false

# One run's whole step timeline is always written as a batch, so batching is
# what makes TestRunStepEntity's SEQUENCE generator pay off — with IDENTITY
# Hibernate cannot batch at all, and without these two it simply does not.
# 50 matches the sequence's allocationSize: one sequence round-trip per batch.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true

# No spring.jpa.database-platform on purpose. Hibernate 7 resolves the dialect
# from JDBC metadata INCLUDING the H2 minor version, which a hardcoded
# org.hibernate.dialect.H2Dialect throws away — and it is one fewer line to
# find on the Postgres move.

# ON, deliberately, for the developer VDI — and the reasons it was off are all
# still true, so read them before copying this anywhere else.
#
# The console is an UNAUTHENTICATED SQL shell. H2's console has a CVE history to
# match (CVE-2021-42392 and CVE-2022-23221 are both remote code execution
# through it), and H2 offers CREATE ALIAS ... AS '<java source>' — so SQL access
# to this database IS code execution inside the orchestrator process.
#
# What makes it acceptable HERE and nowhere else:
#   - this runs on a developer VDI, started from the IDE; nothing publishes
#     :8035 beyond the machine, and Docker is not used at all
#   - web-allow-others=false (H2's own default, written down so it cannot be
#     lost in an edit): the servlet refuses any request that did not come from
#     localhost
#   - the data is run history, not customer data, and the credentials inside
#     the scenarios are redacted on the way in (see Redactor)
#
# TURN IT OFF (enabled=false) the day this is served anywhere other people can
# reach, BEFORE that happens. DevTools also publishes a default of true for
# this key, so deleting the line does not turn it off while devtools is on the
# classpath — the line must say false, not be absent.
#
# Connect at  http://localhost:8035/h2-console
#
#   JDBC URL   jdbc:h2:file:<paste %LOCALAPPDATA% here>/uptest/uptest
#   User       sa          Password  (empty)
#   Driver     org.h2.Driver
#
# The console does NOT resolve ${LOCALAPPDATA}; it needs the expanded path.
# Run  echo %LOCALAPPDATA%  and paste what it prints, so the URL ends up like
#   jdbc:h2:file:C:/Users/<your-username>/AppData/Local/uptest/uptest
# Forward slashes are fine on Windows. Leaving any angle-bracket placeholder in
# the field fails with "InvalidPathException: Illegal char <<>", which names the
# character and not the mistake.
#
# It must resolve to the SAME file as spring.datasource.url above, or H2 quietly
# opens a DIFFERENT, EMPTY database and the tables look missing.
#
# The app holds the file open; the console connects from the same JVM, so H2
# reuses the already-open database rather than fighting its lock. If you do get
# "Database may be already in use", it is the DevTools restart classloader —
# stop the app, open the console on the next start, or use the H2 shell jar.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# A run with no terminal status this long after submission is assumed lost:
# the orchestrator was killed mid-flight, or the executor was restarted and
# pruned it. 30 minutes is far beyond the ~4 minutes a real scenario takes, so
# this never fires on a slow run. LOWER IT AND YOU WILL MARK LIVE RUNS DEAD.
uptest.run.stale-after=30m

# Default page size for GET /api/v1/runs. The endpoint returned every row ever
# submitted; in memory that was bounded by the next restart, and persistence
# removes that accidental bound. The response stays a plain JSON array —
# app.js's renderHistory() iterates the body directly and a Spring Page
# wrapper would render "Kayıt yok" with nothing in the console.
uptest.run.list-limit=50

# Hard cap on blocking executor calls per history listing. list() refreshes
# every unsettled row over HTTP, one 5-second-bounded call each; without a cap,
# N rows orphaned by a crash make /api/v1/runs take 5N seconds.
uptest.run.refresh-max=5
