app: NGC
flow: Online DBS Fatura Oluştur

navigation:
  main_menu: "NAKİT YÖNETİMİ"
  sub_menu: "Online DBS İşlemleri"
  entry_row: "FORD DBS ODEMELERI"
  entry_button: "Fatura Oluştur"
  # "Fatura Oluştur" formu DEĞİL, bir yol ayrımı açıyor: "Oluşturma Tipi" =
  # Bilgi Girişi / Dosya Yükleme. Aşağıdaki 16 alan yalnızca "Bilgi Girişi"
  # formunun alanları; "Dosya Yükleme" bambaşka bir ekran ve kendi kataloğunu
  # ister. Bu yüzden burada bir ALAN değil, navigasyon adımı.
  entry_choice: "Bilgi Girişi"

fields:
  # Bayi Kodu ÖNCE gelmeli: uygulama buna tepki olarak Bayi Ünvanı'nı doldurur
  # ve Döviz Cinsi'nin seçeneklerini yükler. Sıra işlevsel, kozmetik değil.
  - label: "Bayi Kodu"
    type: dropdown
    options: ["93002"]
    verifiable: true
  - label: "Bayi Ünvanı"
    type: text
    readonly: true          # Bayi Kodu seçilince uygulama kendisi doldurur
    verifiable: true
  - label: "Başlangıç Vadesi"
    type: date
    verifiable: true
  - label: "Fatura No"
    type: text
    verifiable: true
  - label: "Orijinal Fatura Numarası"
    type: text
    verifiable: true
  - label: "Döviz Cinsi"
    type: dropdown
    options: ["TL"]
    verifiable: true
  - label: "Taksit Adedi"
    type: text
    verifiable: true
  - label: "Toplam Tutar"
    type: amount
    verifiable: true
  - label: "Orijinal Fatura Tutarı"
    type: amount
    verifiable: true
  - label: "Taksit Periyot Birimi"
    type: dropdown
    options: ["Ay"]
    verifiable: true
  - label: "Taksit Periyodu"
    type: text
    verifiable: true
  - label: "Fatura Dönemi"
    type: text
    verifiable: true
  - label: "Fatura Tarihi"
    type: date
    verifiable: true
  # DÜZELTİLDİ: "E-Arşiv Fatura" eksikti. Bir ajan keşfi üç seçeneği de
  # ölçtü. Eksikliği sessizdi ama ucuz değildi: aşağıdaki "Vergisiz Tutar"
  # yalnızca bu değerle açılıyor, yani seçenek listede olmadan koşul HİÇBİR
  # senaryoda sağlanamaz ve alan ölü yük olarak durur.
  - label: "Fatura Tipi"
    type: dropdown
    options: ["Normal", "E-Fatura", "E-Arşiv Fatura"]
    verifiable: true
  # Üç tipin her biri kendi ek alanını açıyor (analist, ekranda doğruladı):
  #   Normal          → ek alan yok
  #   E-Fatura        → E-Fatura Hash Kodu
  #   E-Arşiv Fatura  → Vergisiz Tutar
  # Her koşullu alanın TEK tetikleyicisi var, bu yüzden shown_when'in tek
  # değer alması burada kısıt değil.
  #
  # İkisi de "Fatura Tipi"nden SONRA duruyor ve bu yer kritik:
  # VariationPlanner alanları tek geçişte katalog sırasıyla geziyor, ebeveyn
  # henüz atanmamışsa koşulu değerlendiremiyor ve alan hiçbir senaryoda
  # doldurulmuyor.
  - label: "E-Fatura Hash Kodu"
    type: text
    shown_when:
      field: "Fatura Tipi"
      value: "E-Fatura"
    verifiable: true
  # type: amount, çünkü ekranda yan yana lira/kuruş kutuları ve "TL" var —
  # "Toplam Tutar" ile aynı şekil. Senaryo `enter amount` kullanacak; `enter`
  # olsaydı tek kutuya yazıp formu boş bırakırdı.
  #
  # ÖLÇÜLMEDİ: verifiable. Hiçbir ajan yürüyüşü henüz "E-Fatura" ya da
  # "E-Arşiv Fatura" seçmedi — hepsi "Normal" ile geçti — yani bu iki alanın
  # onay ekranında görünüp görünmediği note_confirmation ile doğrulanmadı.
  - label: "Vergisiz Tutar"
    type: amount
    shown_when:
      field: "Fatura Tipi"
      value: "E-Arşiv Fatura"
    verifiable: true

buttons:
  - "Devam"
  - "Onay"

# Onay sonrası sonuç ekranının metni henüz görülmedi, o yüzden success_message
# yok — mesaj verilmeyince model doğrulama da yazmıyor.
