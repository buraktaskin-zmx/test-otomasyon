# Executor. Analysts never reach this port directly; only the orchestrator does
# (docker-compose uses `expose`, not `ports`).
server.port=9035

# How many runs this executor takes AT THE SAME TIME. The next one is refused
# with 409, never queued; the UI's run queue holds it and retries.
#
# 4 is an EXPERIMENT (2026-11-07): can one executor carry four scenarios at
# once, and does the bank accept four parallel logins with the same CIF?
#
# It used to be 1 "because Cucumber carries static state and the Playwright
# Browser is shared". That is no longer what the code does: each run is its
# own Main.run, each scenario launches its own Playwright and browser (Hooks),
# RunContext is a thread-local and the step timeline is keyed by run id.
#
# What is still true, and is the price of raising this:
#   - a run stuck in a native Playwright call cannot be killed from Java; /stop
#     only interrupts, the stuck run keeps its slot (CucumberService.slots), and
#     restarting the executor ends EVERY run in it, not just the stuck one;
#   - each running scenario is a Node driver plus a browser, about 1.5 GB; on
#     the VDI four of them are four visible Edge windows.
# Go back to 1 if the experiment says so. SIMULTANEOUSLYRUN overrides it.
simultaneouslyRun=4

# Base directory for per-run working directories ({featuresFolder}/{runId}/).
# Relative by default so the service starts anywhere; the container overrides it
# with a volume the orchestrator can also read:
#   FEATURESFOLDER=/var/qa/runs
featuresFolder=./runs
