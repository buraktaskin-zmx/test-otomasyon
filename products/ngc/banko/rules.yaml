# Banko — iş kuralları.
#
# Her kuralın bir KAYNAĞI var ve kaynağı olmayan kural yazılmadı. "status"
# alanı kesin bilgiyi tahminden ayırır ve varsayılanı VARSAYIM'dır: statüsü
# yazılmamış bir kural doğrulanmış sayılmaz.
#
# "messages" içindeki metinler BİREBİR karşılaştırılır. Buraya hatırladığınız
# gibi değil, ekranda yazdığı gibi yazın.

rules:
  - id: R-BANKO-001
    title: "Ödeme talebi oluşturulunca onay mesajı gösterilir"
    status: DOĞRULANDI
    description: >
      Onay ekranında "Onay" butonuna basıldığında işlem tamamlanır ve ekran
      talebin karşı tarafa iletildiğini bildirir.
    messages:
      - "Ödeme talebiniz karşı tarafa iletilmiştir. Tarafınıza yapılacak ödemenin detaylarını Banko İşlemleri'nden görüntüleyebilirsiniz."
    source: "catalogs/ngc/banko-payment.yaml — success_message, gerçek koşumdan alınmış"

  - id: R-BANKO-010
    title: "Ödeme tutarı boş bırakılamaz"
    status: DOĞRULANDI
    description: >
      Tutar alanı lira ve kuruş olmak üzere AYRI iki input'tur; formun
      doğruladığı değer bu ikisinden hesaplanır. Tutar girilmeden Devam'a
      basıldığında işlem reddedilir.
    fields: ["Ödeme Tutarı"]
    messages:
      - "Toplam tutar giriniz"
    source: >
      Gerçek koşumda gözlendi — CLAUDE.md "Amount fields" dersi: biçimlendirilmiş
      bir tutar tek kutuya yazıldığında form hiçbir şey okumuyor ve submit bu
      mesajla reddediliyor.

  - id: R-BANKO-020
    title: "Vade tarihi geçmiş bir gün olamaz"
    status: VARSAYIM
    description: >
      Takvim bileşeni geçmiş günleri seçilemez hâle getirir, yani kural
      uygulamada takvim üzerinden zorlanır. DBS "Başlangıç Vadesi" alanında
      birebir bu davranış ölçüldü; Banko Vade Tarihi için AYNI OLDUĞU
      VARSAYILIYOR, doğrulanmadı.
    fields: ["Vade Tarihi"]
    source: "DBS Fatura Oluştur'dan çıkarım — Banko ekranında teyit edilmedi"

  - id: R-BANKO-030
    title: "Oluşturma Tipi iki ayrı ekrana ayrılır"
    status: VARSAYIM
    description: >
      "Bilgi Girişi" formu elle doldurtur, "Dosya Yükleme" ise tamamen başka
      bir ekrandır ve Bilgi Girişi'ndeki alanların hiçbiri orada yoktur. Bu
      yüzden katalogda bir alan değil, navigation.entry_choice olarak
      modellenmelidir; aksi hâlde Çoklu Üret senaryoların yarısını her alanda
      timeout'a sokar.
    source: "Ekran görüntüsü (16/10/2026) — DBS Fatura Oluştur'daki aynı yapıdan çıkarım"
